<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM WAEL</title>
<style>
body{background:#101827;color:white;font-family:Arial;margin:0;padding:20px}
header{background:#087c70;padding:20px;text-align:center;border-radius:12px}
.card{background:#26364b;padding:18px;margin:15px 0;border-radius:12px}
input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border:0;border-radius:8px;font-size:16px}
button{background:#0d9488;color:white}
</style>
</head>
<body>
<header><h1>SM WAEL</h1><p>لوحة التحكم عن بعد</p></header>
<div class="card">
<h3>إضافة جهاز</h3>
<input id="name" placeholder="اسم الجهاز">
<select id="type">
<option>PLC</option>
<option>Inverter</option>
<option>Camera</option>
<option>Access Point</option>
</select>
<input id="ip" placeholder="عنوان IP">
<button onclick="add()">إضافة</button>
</div>
<div class="card">
<h3>الأجهزة</h3>
<div id="list">لا توجد أجهزة</div>
</div>
<script>
let devices = JSON.parse(localStorage.getItem('sm_wael_devices') || '[]');

function render() {
  document.getElementById('list').innerHTML = devices.map(d =>
    '<p>' + d.n + ' - ' + d.t + ' - ' + d.ip + '</p>'
  ).join('');
}

function add() {
  let n = document.getElementById('name').value;
  let t = document.getElementById('type').value;
  let ip = document.getElementById('ip').value;

  if (!n || !ip) {
    alert('أكمل البيانات');
    return;
  }

  devices.push({n, t, ip});
  localStorage.setItem('sm_wael_devices', JSON.stringify(devices));
  render();

  document.getElementById('name').value = '';
  document.getElementById('ip').value = '';
}

render();
</script>
  </body
</html>
